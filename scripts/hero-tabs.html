<!-- Build / Work / Grow segmented tabs. Inserted at the top of the hero by scripts/brand.py.
     Design: Figma "v2" frame, node 138:20240. -->
<div class="sh-tabs-wrap">
  <div class="sh-tabs" role="tablist" aria-label="Choose a mode">
    <button type="button" role="tab" class="sh-tab" data-tab="build" aria-selected="false" tabindex="-1">
      <svg class="sh-tab-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 12.5 8.2 6.3M9.6 2.4l2 2M6.9 5.1l2 2M8.2 3.8 4.8 7.2"/><path d="M8.9 1.7c.4-.4 1-.4 1.4 0l2 2c.4.4.4 1 0 1.4L11 6.4 7.6 3l1.3-1.3Z"/></svg>
      <span>Build</span>
    </button>
    <button type="button" role="tab" class="sh-tab on" data-tab="work" aria-selected="true" tabindex="0">
      <img class="sh-tab-icon" src="/hero/monitor.svg" alt="" width="14" height="14">
      <span>Work</span>
    </button>
    <button type="button" role="tab" class="sh-tab" data-tab="grow" aria-selected="false" tabindex="-1">
      <svg class="sh-tab-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 11.5 5.6 7.7l2.5 2.5 4.1-4.6"/><path d="M9.3 5.6h2.9v2.9"/></svg>
      <span>Grow</span>
    </button>
  </div>
</div>
